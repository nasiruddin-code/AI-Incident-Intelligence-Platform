# Alembic CLI config (the service runs migrations itself at startup; see
# app/db/migrate.py). Database URL comes from DATABASE_URL via app settings.
#
#   cd services/ai-service
#   alembic revision -m "describe change"     # new migration in app/db/migrations/versions
#   alembic upgrade head | alembic downgrade -1 | alembic current

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

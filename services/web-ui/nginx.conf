# web-ui: serves the static app and proxies the API to ai-service, so the
# browser talks to one origin (no CORS) and the agent's event stream passes
# straight through.

server {
    listen 8080;
    server_name _;

    # Re-resolve ai-service through Docker's DNS: with a literal hostname nginx
    # resolves it once at startup and keeps the old IP after ai-service is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ai_service http://ai-service:8000;
    root /usr/share/nginx/html;
    index index.html;

    # The UI renders incident data (including log lines) as text only; this
    # policy additionally forbids inline and third-party scripts.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    # Note: a location with its own add_header would drop all of the above
    # (nginx does not merge them), so locations below must not use add_header.

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Agent investigation stream (server-sent events): no buffering, long reads
    location = /api/v1/agent/investigate/stream {
        proxy_pass $ai_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass $ai_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;  # RCA / runbook calls to a real model can take a while
    }

    location / {
        # Hash-based routing (#/incident/...): no SPA fallback, so a missing
        # file is an honest 404 instead of index.html served as JavaScript.
        try_files $uri $uri/ =404;
    }
}

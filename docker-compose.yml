services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_incidents
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - observability-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_incidents"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./services/ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./services/ai-service/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=ai-service
      - LOG_FORMAT=json
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - TEMPO_URL=http://tempo:3200
      - DATABASE_URL=postgresql+psycopg2://ai:ai@postgres:5432/ai_incidents
      # Log monitor: read-only polling of Loki for error patterns (POC defaults)
      - LOG_MONITOR_ENABLED=${LOG_MONITOR_ENABLED:-true}
      - LOG_MONITOR_INTERVAL_SECONDS=${LOG_MONITOR_INTERVAL_SECONDS:-20}
      - LOG_MONITOR_RESOLVE_AFTER_SECONDS=${LOG_MONITOR_RESOLVE_AFTER_SECONDS:-180}
      # Email: local test inbox (Mailpit, http://localhost:8025) by default.
      # To send to a real inbox, set these in a .env file next to this one.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - NOTIFY_EMAIL_FROM=${NOTIFY_EMAIL_FROM:-incident-bot@demo.local}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-["prod-support@demo.local"]}
      - UI_BASE_URL=http://localhost:8080
    networks:
      - observability-net
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      otel-collector:
        condition: service_started

  # --- Week 5: Observability stack ------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter (scraped by Prometheus)
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    networks:
      - observability-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - observability-net
    restart: unless-stopped

  # --- Local POC: free test inbox + read-only log collection ---------------
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"   # web inbox
      - "1025:1025"   # SMTP
    networks:
      - observability-net
    restart: unless-stopped

  # Docker API proxy that only allows GET requests (container list, inspect,
  # logs). Alloy never sees the raw socket, so it cannot start, stop or exec.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      - CONTAINERS=1
      - NETWORKS=1   # discovery reads network labels (GET only)
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability-net
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    environment:
      # Regex of compose projects to watch; ".*" = every container on this host
      - LOGMON_WATCH_PROJECTS=${LOGMON_WATCH_PROJECTS:-.*}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./demo-apps/logs:/var/log/watched:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"   # Alloy UI: pipeline status
    networks:
      - observability-net
    depends_on:
      - docker-proxy
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability-net
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    user: "0"   # run as root so local storage dirs can be created (local-dev only)
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API / query
    # OTLP gRPC (4317) is internal only – collector reaches tempo:4317 on the docker network
    networks:
      - observability-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability-net
    restart: unless-stopped

  # --- Web UI: incidents, evidence, analysis and live agent (proxies /api) --
  web-ui:
    build:
      context: ./services/web-ui
    ports:
      - "8080:8080"
    networks:
      - observability-net
    depends_on:
      - ai-service
    restart: unless-stopped

  # --- Week 6: Sample microservices -----------------------------------------
  payment-service:
    build:
      context: ./services/payment-service
    ports:
      - "8002:8002"
    env_file:
      - ./services/payment-service/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=payment-service
      - LOG_FORMAT=json
    networks:
      - observability-net
    depends_on:
      - otel-collector
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
    ports:
      - "8001:8001"
    env_file:
      - ./services/order-service/.env
    environment:
      - PAYMENT_SERVICE_URL=http://payment-service:8002
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=order-service
      - LOG_FORMAT=json
    networks:
      - observability-net
    depends_on:
      - payment-service
      - otel-collector
    restart: unless-stopped

networks:
  observability-net:
    driver: bridge

volumes:
  alloy-data:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

# Prometheus scrape config (Week 5 + Week 14 alerts)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    scrape_interval: 15s
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Week 14: scrape ai-service Prometheus metrics (incident intelligence)
  - job_name: ai-service
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]
        labels:
          service: ai-service

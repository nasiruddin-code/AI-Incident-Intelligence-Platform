name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the golden-incident evals against a real model (billed API calls)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-service, order-service, payment-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the Dockerfiles
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff==0.6.9

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Tests
        run: pytest -q

  test-postgres:
    name: test (ai-service on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/ai-service
    env:
      # Enables the Postgres variants of the persistence + migration tests
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web-ui:
    name: test (web-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: for f in static/js/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test "tests/*.test.mjs"
      - name: nginx config
        run: |
          docker run --rm --add-host ai-service:127.0.0.1             -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  observability-config:
    name: validate observability + compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prometheus config and alert rules (promtool)
        run: |
          docker run --rm \
            -v "$PWD/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Alertmanager config (amtool)
        run: |
          docker run --rm \
            -v "$PWD/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Grafana dashboards are valid JSON
        run: for f in observability/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null; done

      - name: docker compose config
        run: |
          for s in ai-service order-service payment-service; do
            cp "services/$s/.env.example" "services/$s/.env"
          done
          docker compose config --quiet

  docker-build:
    name: docker build (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-service, order-service, payment-service, web-ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "${{ matrix.service }}:ci" "services/${{ matrix.service }}"

  evals:
    name: golden-incident evals (real model)
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    env:
      AI_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run evals
        run: python -m evals.run_evals --json eval-report.json --min-pass-rate 0.8
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: services/ai-service/eval-report.json
          if-no-files-found: ignore
